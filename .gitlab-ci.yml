image: ${ARTIFACTORY_URL}/docker-official-mirror/python:3.11

stages:
  - build
  - test-package
  - build-docs
  - deploy
  - validate

Build Package:
  stage: build
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install .

Test and Lint:
  stage: test-package
  script:
    # Install dependencies
    - apt-get update -y
    - apt-get upgrade -y
    - apt-get install -y xdg-utils
    - apt-get install -y lynx
    - apt-get install -y graphviz
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - pip install .
    # Test and report coverage
    - coverage run -m pytest
    - coverage report -m
    - coverage html
    # Lint
    - flake8 .
    - pydocstringformatter .
    # Run pydeps
    - pydeps hyswap -T png --max-bacon=3 --cluster
    - mv hyswap.png docs/source/reference/hyswap.png  # move pydeps graph to docs
  artifacts:
    paths:
      - htmlcov/
      - docs/build/
  coverage: '/TOTAL.*\s+(\d+\%)/'

Build Documentation:
  stage: build-docs
  script:
    # Install dependencies
    - apt-get update -y
    - apt-get upgrade -y
    - apt-get install -y xdg-utils
    - apt-get install -y lynx
    - apt-get install -y graphviz
    - apt-get install -y pandoc
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - pip install .
    # Add API USGS PAT to python environment
    - export API_USGS_PAT=${API_USGS_PAT}
    # Test and build documentation
    - cd docs
    - make docs
  artifacts:
    paths:
      - docs/build/
  rules:
    -  if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_COMMIT_BRANCH == "main"'

# Publish the Sphinx HTML built in "Build Documentation" to GitLab Pages.
# The job must be named "pages" and publish a folder named "public".
pages:
  stage: deploy
  needs:
    - job: Build Documentation
      artifacts: true
  script:
    - mv docs/build/html public
  artifacts:
    paths:
      - public
  rules:
    # Same rule as "Build Documentation" so the docs it builds are always available.
    # Note: an MR pipeline deploys that MR's docs to the live site before merging.
    -  if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_COMMIT_BRANCH == "main"'

Validate Inventory:
    stage: validate
    image: ${INTERNAL_REGISTRY}software/software-management:latest
    script:
      - software-management review
        --project "${CI_PROJECT_PATH}"
        --ref "${CI_COMMIT_BRANCH}"
        --type "provisional"
        --token "${GITLAB_PAT}"
    tags:
        - chs-shared
    rules:
      - if: '$CI_COMMIT_BRANCH == "main" && $GITLAB_PAT != null'
